<main
  class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-10"
>
  <div
    class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-8 shadow-sm"
  >
    <div class="mb-6 text-center">
      <div class="text-2xl font-semibold text-brand-600">
        Create your account
      </div>
      <div class="text-sm text-slate-400">Join Eventer in a few seconds</div>
    </div>

    @if (formError) {
      <div class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-600">
        {{ formError }}
      </div>
    }

    <form (ngSubmit)="handleSubmit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <input
          [(ngModel)]="form.name"
          name="name"
          placeholder="Full name"
          class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-800 placeholder:text-slate-400"
        />
        @if (errors.name) {
          <span class="text-sm font-medium text-red-700">{{ errors.name }}</span>
        }
      </div>

      <app-text-field
        label="Email"
        type="email"
        [(value)]="form.email"
        placeholder="you@example.com"
        [error]="errors.email || ''"
      />
      <app-text-field
        label="Password"
        type="password"
        [(value)]="form.password"
        placeholder="At least 6 characters"
        [error]="errors.password || ''"
      />
      <app-text-field
        label="Confirm password"
        type="password"
        [(value)]="form.confirmPassword"
        placeholder="Repeat your password"
        [error]="errors.confirmPassword || ''"
      />

      <div
        class="flex cursor-pointer items-center gap-2 text-sm text-slate-600"
        (click)="form.isAdmin = !form.isAdmin"
      >
        <input type="checkbox" [checked]="form.isAdmin" readonly />
        <span>Register as an administrator</span>
      </div>

      <app-button type="submit" className="mt-2 w-full">
        Create account
      </app-button>
    </form>

    <div class="mt-4 text-center text-sm text-slate-500">
      Already have an account?
      <a routerLink="/login" class="text-brand-600 hover:underline">Log in</a>
    </div>
  </div>
</main>
