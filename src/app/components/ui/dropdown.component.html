<div
  class="relative w-56"
  (focusout)="onFocusOut($event)"
  (keydown.escape)="open = false"
>
  <button
    type="button"
    [id]="triggerId"
    (click)="toggle()"
    aria-haspopup="true"
    [attr.aria-expanded]="open"
    [attr.aria-controls]="listId"
    [attr.aria-labelledby]="labelledBy ? labelledBy + ' ' + triggerId : null"
    class="flex w-full cursor-pointer items-center justify-between rounded-md border border-slate-400 bg-white px-3 py-2 text-base text-slate-800"
  >
    <span [class]="selected ? '' : 'text-slate-600'">
      {{ selected ? selected.label : placeholder }}
    </span>
    <span class="text-slate-600" aria-hidden="true">▾</span>
  </button>

  @if (open) {
    <ul
      [id]="listId"
      class="absolute z-20 mt-1 w-full overflow-hidden rounded-md border border-slate-300 bg-white shadow-lg"
    >
      @for (option of options; track option.value) {
        <li>
          <button
            type="button"
            (click)="select(option.value)"
            [attr.aria-current]="option.value === value ? 'true' : null"
            class="block w-full px-3 py-2 text-left text-base text-slate-800 hover:bg-brand-50"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
