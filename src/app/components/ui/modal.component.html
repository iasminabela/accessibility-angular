<!-- Native <dialog> + showModal() makes the page behind it inert and exposes aria-modal. -->
<dialog
  #dialog
  [attr.aria-labelledby]="titleId"
  (cancel)="$event.preventDefault()"
  (keydown.escape)="onEscape($event)"
  (keydown.tab)="trapFocus($event)"
  (keydown.shift.tab)="trapFocus($event)"
  class="m-auto w-full max-w-lg overflow-visible rounded-lg bg-white p-0 shadow-xl backdrop:bg-black/40"
>
  <div
    class="flex items-center justify-between border-b border-slate-200 px-5 py-4"
  >
    <h2 [id]="titleId" class="text-lg font-semibold text-slate-800">
      {{ title }}
    </h2>
    <button
      type="button"
      (click)="close.emit()"
      aria-label="Close"
      class="text-xl leading-none text-slate-400 hover:text-slate-600"
    >
      <span aria-hidden="true">×</span>
    </button>
  </div>
  <div #body class="px-5 py-4">
    <ng-content></ng-content>
  </div>
</dialog>
