<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-5 gap-y-2 px-4 py-3">
    <a routerLink="/dashboard" class="flex items-center gap-2 text-brand-600">
      <span class="text-2xl">◆</span>
      <span class="text-lg font-semibold">Eventer</span>
    </a>

    <nav aria-label="Main" class="flex flex-wrap items-center gap-x-5 gap-y-2 text-sm">
      @if (auth.isAuthenticated()) {
        <a routerLink="/dashboard" class="font-semibold text-slate-600 hover:text-brand-600"
          >Dashboard</a
        >
        <a routerLink="/events" class="font-semibold text-slate-600 hover:text-brand-600"
          >Events</a
        >
      }
      @if (auth.isAdmin()) {
        <div
          class="relative"
          (mouseenter)="adminMenuOpen = true"
          (mouseleave)="adminMenuOpen = false"
          (focusout)="onAdminFocusOut($event)"
          (keydown.escape)="adminMenuOpen = false"
        >
          <button
            type="button"
            (click)="adminMenuOpen = !adminMenuOpen"
            aria-haspopup="true"
            [attr.aria-expanded]="adminMenuOpen"
            aria-controls="admin-menu"
            class="flex items-center gap-1 font-semibold text-slate-600 hover:text-brand-600"
          >
            Admin
            <!-- Chevron marks this as a menu toggle, not a plain link. -->
            <span
              aria-hidden="true"
              class="text-xs transition-transform"
              [class.rotate-180]="adminMenuOpen"
              >▾</span
            >
          </button>
          @if (adminMenuOpen) {
            <div id="admin-menu" class="absolute right-0 top-full z-20 w-32 pt-2">
              <div
                class="overflow-hidden rounded-md border border-slate-200 bg-white shadow-lg"
              >
                <a
                  routerLink="/admin/users"
                  (click)="adminMenuOpen = false"
                  class="block px-3 py-2 text-sm text-slate-600 hover:bg-brand-50 hover:text-brand-600"
                  >Users</a
                >
                <a
                  routerLink="/admin/events"
                  (click)="adminMenuOpen = false"
                  class="block px-3 py-2 text-sm text-slate-600 hover:bg-brand-50 hover:text-brand-600"
                  >Events</a
                >
              </div>
            </div>
          }
        </div>
      }
      @if (auth.isAuthenticated()) {
        <!-- Divider + avatar set the user info apart from the nav links; it is plain text, not interactive. -->
        <div
          class="flex flex-wrap items-center gap-3 border-l border-slate-200 pl-5"
        >
          <span class="flex items-center gap-2 text-slate-800">
            <span
              aria-hidden="true"
              class="flex h-7 w-7 items-center justify-center rounded-full bg-brand-100 text-xs font-semibold text-brand-700"
              >{{ auth.currentUser()?.name?.charAt(0) }}</span
            >
            <span class="sr-only">Signed in as</span>
            <span class="font-medium">{{ auth.currentUser()?.name }}</span>
          </span>
          <button
            type="button"
            (click)="handleLogout()"
            class="rounded-md border border-slate-300 bg-white px-3 py-1.5 font-medium text-slate-700 shadow-sm hover:border-slate-400 hover:bg-slate-50"
          >
            Log out
          </button>
        </div>
      } @else {
        <a routerLink="/login" class="font-semibold text-slate-600 hover:text-brand-600"
          >Log in</a
        >
        <a
          routerLink="/register"
          class="rounded bg-brand-500 px-3 py-1.5 text-white hover:bg-brand-600"
          >Sign up</a
        >
      }
    </nav>
  </div>
</header>
