<div class="flex flex-wrap items-end gap-4">
  <div class="flex w-full flex-col gap-1 sm:w-auto">
    <label for="event-search" class="text-base font-medium text-slate-700"
      >Search</label
    >
    <div class="relative w-full sm:w-64">
      <input
        #searchInput
        id="event-search"
        type="search"
        [value]="search"
        (input)="onSearchChange.emit($any($event.target).value)"
        placeholder="Search events"
        class="w-full rounded-md border border-slate-400 py-2 pl-3 pr-9 text-base text-slate-800 placeholder:text-slate-500"
      />
      @if (search) {
        <button
          type="button"
          (click)="clearSearch(searchInput)"
          aria-label="Clear search"
          class="absolute right-1 top-1/2 flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded text-slate-500 hover:bg-slate-100 hover:text-slate-800"
        >
          <span aria-hidden="true">✕</span>
        </button>
      }
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <span id="event-location-label" class="text-base font-medium text-slate-700"
      >Location</span
    >
    <app-dropdown
      [options]="locationOptions"
      [value]="location"
      (valueChange)="onLocationChange.emit($event)"
      placeholder="All locations"
      labelledBy="event-location-label"
    />
  </div>

  @if (search || location) {
    <button
      type="button"
      (click)="clear()"
      aria-label="Clear filters"
      class="mb-1 rounded px-2 py-1 text-base text-slate-600 hover:text-slate-800"
    >
      ✕
    </button>
  }
</div>
