<div class="flex flex-wrap items-end gap-4">
  <div class="flex w-full flex-col gap-1 sm:w-auto">
    <label for="event-search" class="text-base font-medium text-slate-700"
      >Search</label
    >
    <input
      id="event-search"
      type="search"
      [value]="search"
      (input)="onSearchChange.emit($any($event.target).value)"
      placeholder="Search events"
      class="w-full rounded-md border border-slate-400 px-3 py-2 text-base text-slate-800 placeholder:text-slate-500 sm:w-64"
    />
  </div>

  <div class="flex flex-col gap-1">
    <span id="event-location-label" class="text-base font-medium text-slate-700"
      >Location</span
    >
    <app-dropdown
      [options]="locationOptions"
      [value]="location"
      (valueChange)="onLocationChange.emit($event)"
      placeholder="All locations"
      labelledBy="event-location-label"
    />
  </div>

  @if (search || location) {
    <button
      type="button"
      (click)="clear()"
      aria-label="Clear filters"
      class="mb-1 rounded px-2 py-1 text-base text-slate-600 hover:text-slate-800"
    >
      ✕
    </button>
  }
</div>
