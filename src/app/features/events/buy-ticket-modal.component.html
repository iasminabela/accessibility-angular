<app-modal
  [open]="open"
  [title]="'Buy ticket — ' + event.name"
  (close)="close.emit()"
>
  @if (result) {
    <div
      [class]="
        result.type === 'success'
          ? 'mb-4 rounded-md px-3 py-2 text-sm bg-green-50 text-green-700'
          : 'mb-4 rounded-md px-3 py-2 text-sm bg-red-50 text-red-600'
      "
    >
      {{ result.text }}
    </div>
  }

  <form (ngSubmit)="handleSubmit()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <input
        [(ngModel)]="card"
        name="card"
        placeholder="Card number"
        class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-800 placeholder:text-slate-400"
      />
      @if (cardError) {
        <span class="text-xs text-red-500">{{ cardError }}</span>
      }
    </div>

    <app-text-field
      label="Name on card"
      [(value)]="name"
      placeholder="Jane Doe"
      [error]="nameError"
    />

    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <input
          [(ngModel)]="expiry"
          name="expiry"
          placeholder="MM/YY"
          class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-800 placeholder:text-slate-400"
        />
        @if (expiryError) {
          <span class="text-xs text-red-500">{{ expiryError }}</span>
        }
      </div>
      <div class="flex flex-col gap-1">
        <input
          [(ngModel)]="cvc"
          name="cvc"
          placeholder="CVC"
          class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-800 placeholder:text-slate-400"
        />
        @if (cvcError) {
          <span class="text-xs text-red-500">{{ cvcError }}</span>
        }
      </div>
    </div>

    <div
      class="flex items-center justify-between border-t border-slate-100 pt-4"
    >
      <span class="text-sm text-slate-500">Total</span>
      <span class="text-lg font-semibold text-slate-800">
        {{ formatCurrency(event.price) }}
      </span>
    </div>

    <div class="flex justify-end gap-2">
      <app-button type="button" variant="secondary" (clicked)="close.emit()">
        Cancel
      </app-button>
      <app-button type="submit" [disabled]="!isComplete"> Pay now </app-button>
    </div>
  </form>
</app-modal>
